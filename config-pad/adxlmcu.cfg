# =============================================================================
#  KUSBA v2.4 (Isik's Tech) - acelerometro para medir resonancias
#
#  Variante RAMPON: usa pines con nombre y NO lleva spi_bus. La configuracion
#  que circula por internet es la otra variante y aqui no funciona.
#
#  AVISO: el [include adxlmcu.cfg] del printer.cfg debe estar COMENTADO
#  mientras el KUSBA no este fisicamente conectado. Si se deja activo sin la
#  placa, KLIPPER NO ARRANCA. Ya paso una vez.
#
#  Usar scripts/activar-acelerometro.sh para activarlo y desactivarlo, que
#  comprueba que la placa este presente antes de tocar nada.
# =============================================================================

[mcu adxl]
serial: /dev/serial/by-id/usb-Anchor_Rampon-if00

[adxl345]
cs_pin: adxl:CS
axes_map: x,-z,y

[resonance_tester]
accel_chip: adxl345
# Delta: se mide en el centro de la cama, con el sensor montado en el efector
probe_points:
    0, 0, 20

# -----------------------------------------------------------------------------
#  COMO MEDIR
# -----------------------------------------------------------------------------
#  1. Montar el KUSBA en el efector y conectarlo por USB
#  2. bash scripts/activar-acelerometro.sh on
#  3. La PRIMERA lectura del ADXL siempre sale invalida por diseño:
#         ACCELEROMETER_QUERY
#     Ejecutarlo una vez y descartar el resultado antes de medir.
#  4. Medir cada eje:
#         SHAPER_CALIBRATE AXIS=X
#         SHAPER_CALIBRATE AXIS=Y
#  5. Desmontar el sensor y:
#         bash scripts/activar-acelerometro.sh off
#
#  Ojo con las calibraciones largas: nginx corta a los 10 minutos con un 504.
#  Ese 504 NO es un fallo, Klipper sigue midiendo. Consultar el estado, no
#  esperar la respuesta.
#
#  Valores medidos en esta maquina (ver README):
#      shaper_type_x: ei   shaper_freq_x: 36.0
#      shaper_type_y: ei   shaper_freq_y: 39.0
#      max_accel: 3000
#
#  La resonancia principal esta en ~33 Hz en ambos ejes y no se puede subir:
#  es intrinseca a la geometria (brazos largos, chasis alto). Se comprobo tres
#  veces. Lo que si bajo un 40% fue la amplitud, tensando las correas.
# =============================================================================
